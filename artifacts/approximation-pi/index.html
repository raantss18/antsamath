  <header class="art-nav">
    <a class="back" href="../../index.html">← <span data-fr="Accueil" data-en="Home">Accueil</span></a>
    <div class="art-head">
      <div class="tag" data-fr="Nombres · Une constante célèbre" data-en="Numbers · A famous constant">Nombres · Une constante célèbre</div>
      <h1 data-fr="Approximer π" data-en="Approximating π">Approximer π</h1>
    </div>
    <div class="art-tools">
      <button class="themebtn" type="button"></button>
      <button class="langbtn" type="button">EN</button>
    </div>
  </header>

  <main class="art-main">
    <div class="stage-wrap">
      <div class="stage">
        <canvas id="cv"></canvas>
        <div class="readouts">
          <span class="pill" data-fr="estimation" data-en="estimate">estimation</span><span class="pill"><b id="r-est">—</b></span>
          <span class="pill">π <b id="r-pi">3.14159</b></span>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="block" id="sim-controls"></div>

      <div class="block">
        <h3><span class="ic">∿</span><span data-fr="La méthode" data-en="The method">La méthode</span></h3>
        <div class="seg" id="methods" data-tip-fr="Trois façons historiques d’approcher π. Archimède encadre le cercle par des polygones ; Leibniz additionne une série infinie ; Monte Carlo utilise le hasard." data-tip-en="Three historical ways to approach π. Archimedes brackets the circle with polygons; Leibniz sums an infinite series; Monte Carlo uses randomness.">
          <button data-m="archi" class="on" data-fr="Archimède" data-en="Archimedes">Archimède</button>
          <button data-m="leibniz" data-fr="Leibniz" data-en="Leibniz">Leibniz</button>
          <button data-m="mc" data-fr="Monte Carlo" data-en="Monte Carlo">Monte Carlo</button>
        </div>
      </div>

      <div class="block">
        <h3><span class="ic">∑</span><span data-fr="Convergence" data-en="Convergence">Convergence</span></h3>
        <div class="kv">
          <span class="k" id="k-step-lab" data-fr="Étape" data-en="Step">Étape</span><span class="v" id="k-step">—</span>
          <span class="k" data-fr="Estimation" data-en="Estimate">Estimation</span><span class="v hot" id="k-est">—</span>
          <span class="k" data-fr="Erreur" data-en="Error">Erreur</span><span class="v" id="k-err">—</span>
        </div>
      </div>

      <div class="block lesson">
        <h3><span class="ic">𝑓</span><span data-fr="La notion" data-en="The idea">La notion</span></h3>
        <div class="step">
          <span class="lab" data-fr="Intuition" data-en="Intuition">Intuition</span>
          <div class="body" data-fr="π relie le tour d’un cercle à son diamètre. Comme il est <strong>irrationnel</strong>, on ne peut pas l’écrire exactement : on ne fait que s’en approcher de mieux en mieux." data-en="π links a circle’s perimeter to its diameter. Being <strong>irrational</strong>, it can’t be written exactly: we only get closer and closer." data-html="1"></div>
        </div>
        <div class="step">
          <span class="lab" data-fr="Formule" data-en="Formula">Formule</span>
          <div class="body" id="method-formula-note" data-fr="La formule dépend de la méthode choisie :" data-en="The formula depends on the chosen method:" data-html="1"></div>
          <div class="fbox" id="f-method">—</div>
        </div>
        <div class="step">
          <span class="lab" data-fr="Détail" data-en="Detail">Détail</span>
          <div class="body" id="method-note" data-html="1"></div>
        </div>
        <p class="tip" data-fr="<b>Compare la vitesse :</b> Archimède gagne ~1 décimale tous les quelques côtés ; Leibniz converge si lentement qu’il faut des centaines de termes pour 2 décimales ; Monte Carlo est lent et bruité. Mets la vitesse au minimum et utilise le pas-à-pas." data-en="<b>Compare the speed:</b> Archimedes gains ~1 digit every few sides; Leibniz converges so slowly it needs hundreds of terms for 2 digits; Monte Carlo is slow and noisy. Set speed to minimum and use Step." data-html="1"></p>
      </div>
