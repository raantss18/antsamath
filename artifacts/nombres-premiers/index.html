<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nombres premiers · antsamath</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("antsamath-theme")||"light";document.documentElement.lang=localStorage.getItem("antsamath-lang")||"fr";</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/theme-a.css" />
<link rel="stylesheet" href="../../assets/artifact.css" />
<style>
  body { --accent: #4F5BE0; }
  html[data-theme="dark"] body { --accent: #8B97FF; }
</style>
</head>
<body>
  <header class="art-nav">
    <a class="back" href="../../index.html">← <span data-fr="Accueil" data-en="Home">Accueil</span></a>
    <div class="art-head">
      <div class="tag" data-fr="Nombres · Arithmétique" data-en="Numbers · Arithmetic">Nombres · Arithmétique</div>
      <h1 data-fr="Nombres premiers" data-en="Prime numbers">Nombres premiers</h1>
    </div>
    <div class="art-tools">
      <button class="themebtn" type="button"></button>
      <button class="langbtn" type="button">EN</button>
    </div>
  </header>

  <main class="art-main">
    <div class="stage-wrap">
      <div class="stage">
        <canvas id="cv"></canvas>
        <div class="readouts">
          <span class="pill" data-fr="premiers" data-en="primes">premiers</span><span class="pill"><b id="r-count">0</b></span>
          <span class="pill" data-fr="dernier" data-en="last">dernier</span><span class="pill"><b id="r-last">—</b></span>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="block" id="sim-controls"></div>

      <div class="block">
        <h3><span class="ic">▦</span><span data-fr="La vue" data-en="The view">La vue</span></h3>
        <div class="seg" id="views" data-tip-fr="Deux façons de voir les premiers : le crible élimine les multiples un à un ; la spirale d’Ulam enroule les entiers et n’éclaire que les premiers." data-tip-en="Two ways to see primes: the sieve removes multiples one by one; Ulam’s spiral coils the integers and lights only the primes.">
          <button data-v="sieve" class="on" data-fr="Crible d’Ératosthène" data-en="Sieve of Eratosthenes">Crible d’Ératosthène</button>
          <button data-v="ulam" data-fr="Spirale d’Ulam" data-en="Ulam spiral">Spirale d’Ulam</button>
        </div>
        <div class="ctrl" style="margin-top:14px" data-tip-fr="Plus grand entier exploré. Plus il est grand, plus on voit la raréfaction des premiers (et les diagonales de la spirale)." data-tip-en="Largest integer explored. The larger it is, the more you see primes thinning out (and the spiral’s diagonals).">
          <label><span data-fr="Jusqu’à n" data-en="Up to n">Jusqu’à n</span><span class="val" id="v-n">289</span></label>
          <input type="range" id="s-n" min="49" max="961" step="4" value="289" />
        </div>
      </div>

      <div class="block">
        <h3><span class="ic">∑</span><span data-fr="Décompte" data-en="Count">Décompte</span></h3>
        <div class="kv">
          <span class="k" data-fr="Premiers trouvés" data-en="Primes found">Premiers trouvés</span><span class="v hot" id="k-count">0</span>
          <span class="k" data-fr="Dernier premier" data-en="Last prime">Dernier premier</span><span class="v" id="k-last">—</span>
          <span class="k" data-fr="Densité réelle" data-en="Actual density">Densité réelle</span><span class="v" id="k-dens">—</span>
          <span class="k">≈ 1 ⁄ ln n</span><span class="v" id="k-approx">—</span>
        </div>
      </div>

      <div class="block lesson">
        <h3><span class="ic">𝑓</span><span data-fr="La notion" data-en="The idea">La notion</span></h3>
        <div class="step">
          <span class="lab" data-fr="Intuition" data-en="Intuition">Intuition</span>
          <div class="body" data-fr="Un nombre <strong>premier</strong> n’a que deux diviseurs : 1 et lui-même (2, 3, 5, 7, 11…). Ce sont les « briques » qui fabriquent tous les autres nombres par multiplication." data-en="A <strong>prime</strong> has exactly two divisors: 1 and itself (2, 3, 5, 7, 11…). They are the building blocks that make every other number by multiplication." data-html="1"></div>
        </div>
        <div class="step">
          <span class="lab" data-fr="Méthode" data-en="Method">Méthode</span>
          <div class="body" id="view-note" data-html="1"></div>
        </div>
        <div class="step">
          <span class="lab" data-fr="Détail" data-en="Detail">Détail</span>
          <div class="body" data-fr="Les premiers se raréfient mais ne s’arrêtent jamais (Euclide, il y a 2 300 ans). Le théorème des nombres premiers dit que leur densité autour de n vaut environ 1⁄ln n :" data-en="Primes thin out but never stop (Euclid, 2,300 years ago). The prime number theorem says their density around n is about 1⁄ln n:" data-html="1"></div>
          <div class="fbox">π(n) ≈ <span class="hot">n ⁄ ln n</span></div>
        </div>
        <p class="tip" data-fr="<b>Essaie :</b> ralentis et regarde le crible barrer les multiples de 2, puis de 3, puis de 5… Passe à la spirale d’Ulam : les premiers s’alignent sur d’étranges diagonales." data-en="<b>Try it:</b> slow it down and watch the sieve cross multiples of 2, then 3, then 5… Switch to Ulam’s spiral: primes line up on strange diagonals." data-html="1"></p>
      </div>
    </aside>
  </main>

  <section class="feedback-wrap" id="feedback"></section>

  <script src="../../assets/config.js"></script>
  <script src="../../assets/common.js"></script>
  <script src="../../assets/simkit.js"></script>
  <script src="sim.js"></script>
  <script src="../../assets/feedback.js"></script>
</body>
</html>
