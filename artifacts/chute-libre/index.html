<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chute libre · antsamath</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("antsamath-theme")||"light";document.documentElement.lang=localStorage.getItem("antsamath-lang")||"fr";</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/theme-a.css" />
<link rel="stylesheet" href="../../assets/artifact.css" />
<style>
  body { --accent: #1F73E8; }
  html[data-theme="dark"] body { --accent: #5AA0FF; }
</style>
</head>
<body>
  <header class="art-nav">
    <a class="back" href="../../index.html">← <span data-fr="Accueil" data-en="Home">Accueil</span></a>
    <div class="art-head">
      <div class="tag" data-fr="Dynamique · Cinématique" data-en="Dynamics · Kinematics">Dynamique · Cinématique</div>
      <h1 data-fr="Chute libre & projectiles" data-en="Free fall & projectiles">Chute libre & projectiles</h1>
    </div>
    <div class="art-tools">
      <button class="themebtn" type="button"></button>
      <button class="langbtn" type="button">EN</button>
    </div>
  </header>

  <main class="art-main">
    <div class="stage-wrap">
      <div class="stage">
        <canvas id="cv"></canvas>
        <div class="readouts">
          <span class="pill" data-fr="portée" data-en="range">portée</span><span class="pill"><b id="r-range">0 m</b></span>
          <span class="pill" data-fr="h. max" data-en="max h.">h. max</span><span class="pill"><b id="r-h">0 m</b></span>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="block">
        <h3><span class="ic">▲</span><span data-fr="Le tir" data-en="The launch">Le tir</span></h3>
        <div class="ctrl">
          <label><span data-fr="Angle θ" data-en="Angle θ">Angle θ</span><span class="val" id="v-ang">45°</span></label>
          <input type="range" id="s-ang" min="5" max="85" step="1" value="45" />
        </div>
        <div class="ctrl">
          <label><span data-fr="Vitesse initiale v₀" data-en="Initial speed v₀">Vitesse initiale v₀</span><span class="val" id="v-v0">30 m/s</span></label>
          <input type="range" id="s-v0" min="5" max="60" step="1" value="30" />
        </div>
        <div class="btnrow">
          <button class="mini primary" id="btn-play" data-fr="Pause" data-en="Pause">Pause</button>
          <button class="mini ghost" id="btn-fire" data-fr="Relancer" data-en="Relaunch">Relancer</button>
        </div>
      </div>

      <div class="block">
        <h3><span class="ic">↓</span><span data-fr="La gravité" data-en="Gravity">La gravité</span></h3>
        <div class="seg" id="grav">
          <button data-g="9.81" class="on" data-fr="Terre" data-en="Earth">Terre</button>
          <button data-g="1.62" data-fr="Lune" data-en="Moon">Lune</button>
          <button data-g="3.71" data-fr="Mars" data-en="Mars">Mars</button>
          <button data-g="24.79" data-fr="Jupiter" data-en="Jupiter">Jupiter</button>
        </div>
        <div class="ctrl" style="margin-top:14px">
          <label><span data-fr="g (m/s²)" data-en="g (m/s²)">g (m/s²)</span><span class="val" id="v-g">9.81</span></label>
          <input type="range" id="s-g" min="1" max="25" step="0.01" value="9.81" />
        </div>
      </div>

      <div class="block">
        <h3><span class="ic">≈</span><span data-fr="Résistance de l’air" data-en="Air resistance">Résistance de l’air</span></h3>
        <div class="toggle-row" style="margin-bottom:14px">
          <span data-fr="Activer le frottement" data-en="Enable drag">Activer le frottement</span>
          <label class="switch"><input type="checkbox" id="drag" /><span class="track"></span></label>
        </div>
        <div class="ctrl" id="c-k" style="display:none">
          <label><span data-fr="Coefficient de traînée" data-en="Drag coefficient">Coefficient de traînée</span><span class="val" id="v-k">0.010</span></label>
          <input type="range" id="s-k" min="0.002" max="0.05" step="0.002" value="0.01" />
        </div>
      </div>

      <div class="block">
        <h3><span class="ic">∑</span><span data-fr="Mesures" data-en="Measurements">Mesures</span></h3>
        <div class="kv">
          <span class="k" data-fr="Portée" data-en="Range">Portée</span><span class="v hot" id="k-range">—</span>
          <span class="k" data-fr="Hauteur max" data-en="Max height">Hauteur max</span><span class="v" id="k-h">—</span>
          <span class="k" data-fr="Temps de vol" data-en="Flight time">Temps de vol</span><span class="v" id="k-t">—</span>
        </div>
      </div>

      <div class="block lesson">
        <h3><span class="ic">𝑓</span><span data-fr="La notion" data-en="The idea">La notion</span></h3>
        <p data-fr="Sans air, le mouvement se décompose en deux : horizontalement la vitesse est <strong>constante</strong>, verticalement la gravité fait une <strong>accélération constante</strong>. Le résultat est une <strong>parabole</strong>." data-en="Without air, the motion splits in two: horizontally the speed is <strong>constant</strong>, vertically gravity gives a <strong>constant acceleration</strong>. The result is a <strong>parabola</strong>." data-html="1"></p>
        <div class="fbox">x(t) = v₀·cosθ·t<br>y(t) = v₀·sinθ·t − ½·g·t²</div>
        <p data-fr="On en déduit la <strong>portée</strong> (distance au sol) et la <strong>hauteur maximale</strong> :" data-en="From this we get the <strong>range</strong> (ground distance) and the <strong>maximum height</strong>:" data-html="1"></p>
        <div class="fbox"><span class="hot">R</span> = v₀²·sin(2θ) ⁄ g &nbsp;·&nbsp; H = v₀²·sin²θ ⁄ 2g</div>
        <p class="tip" data-fr="<b>Essaie :</b> la portée est maximale à <strong>45°</strong>. Active la résistance de l’air : la parabole devient asymétrique et la portée chute." data-en="<b>Try it:</b> range is greatest at <strong>45°</strong>. Turn on air drag: the parabola becomes asymmetric and the range drops." data-html="1"></p>
      </div>
    </aside>
  </main>

  <section class="feedback-wrap" id="feedback"></section>

  <script src="../../assets/config.js"></script>
  <script src="../../assets/common.js"></script>
  <script src="sim.js"></script>
  <script src="../../assets/feedback.js"></script>
</body>
</html>
