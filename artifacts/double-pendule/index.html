<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pendules · antsamath</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("antsamath-theme")||"light";document.documentElement.lang=localStorage.getItem("antsamath-lang")||"fr";</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/theme-a.css" />
<link rel="stylesheet" href="../../assets/artifact.css" />
<style>
  body { --accent: #E23A30; }
  html[data-theme="dark"] body { --accent: #FF6B61; }

  /* ── sélecteur de mode ── */
  .mode-row {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    padding: 7px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--border, #ddd);
    background: transparent;
    color: var(--fg, #222);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    line-height: 1.2;
  }
  .mode-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mode-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── readouts étendus ── */
  .readouts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 12px;
    pointer-events: none;
  }
  .pill {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    background: var(--card, #fff);
    border: 1px solid var(--border, #ddd);
    border-radius: 20px;
    padding: 3px 10px;
    white-space: nowrap;
    opacity: 0.93;
  }
  .pill b { color: var(--accent); margin-left: 4px; }
</style>
</head>
<body>
  <header class="art-nav">
    <a class="back" href="../../index.html">← <span data-fr="Accueil" data-en="Home">Accueil</span></a>
    <div class="art-head">
      <div class="tag" data-fr="Dynamique · Théorie du chaos" data-en="Dynamics · Chaos theory">Dynamique · Théorie du chaos</div>
      <h1 data-fr="Pendules" data-en="Pendulums">Pendules</h1>
    </div>
    <div class="art-tools">
      <button class="themebtn" type="button"></button>
      <button class="langbtn" type="button">EN</button>
    </div>
  </header>

  <main class="art-main">
    <div class="stage-wrap">
      <div class="stage">
        <canvas id="cv"></canvas>
        <div class="readouts">
          <span class="pill">θ₁ <b id="r-t1">0°</b></span>
          <span class="pill" id="pill-t2">θ₂ <b id="r-t2">0°</b></span>
          <span class="pill" id="pill-t3" style="display:none">θ₃ <b id="r-t3">0°</b></span>
          <span class="pill">ω₁ <b id="r-w1">0 rad/s</b></span>
          <span class="pill" id="pill-w2">ω₂ <b id="r-w2">0 rad/s</b></span>
          <span class="pill" id="pill-w3" style="display:none">ω₃ <b id="r-w3">0 rad/s</b></span>
          <span class="pill">E <b id="r-e">0 J</b></span>
          <span class="pill">T <b id="r-T">0 s</b></span>
          <span class="pill" id="pill-gap" style="display:none"><span data-fr="écart" data-en="gap">écart</span> <b id="r-gap">0</b></span>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <aside class="panel">

      <!-- Sélecteur de mode -->
      <div class="block">
        <h3><span class="ic">⊙</span><span data-fr="Type de pendule" data-en="Pendulum type">Type de pendule</span></h3>
        <div class="mode-row">
          <button class="mode-btn" data-mode="1" data-fr="Simple" data-en="Simple">Simple</button>
          <button class="mode-btn active" data-mode="2" data-fr="Double" data-en="Double">Double</button>
          <button class="mode-btn" data-mode="3" data-fr="Triple" data-en="Triple">Triple</button>
        </div>
        <div class="btnrow" style="margin-bottom:12px">
          <button class="mini primary" id="btn-play" data-fr="Pause" data-en="Pause">Pause</button>
          <button class="mini ghost" id="btn-reset" data-fr="Réinitialiser" data-en="Reset">Réinitialiser</button>
        </div>
        <div class="toggle-row">
          <span data-fr="Pendule jumeau (+0,001 rad)" data-en="Twin pendulum (+0.001 rad)">Pendule jumeau (+0,001 rad)</span>
          <label class="switch"><input type="checkbox" id="twin" /><span class="track"></span></label>
        </div>
      </div>

      <!-- Paramètres dynamiques (rempli par JS) -->
      <div class="block">
        <h3><span class="ic">⚙</span><span data-fr="Paramètres" data-en="Parameters">Paramètres</span></h3>
        <div id="param-blocks"></div>
      </div>

      <!-- Théorie (contenu rempli par JS) -->
      <div class="block lesson">
        <h3><span class="ic">𝑓</span><span data-fr="La notion" data-en="The idea">La notion</span></h3>
        <div id="theory-content"></div>
      </div>

    </aside>
  </main>

  <script src="../../assets/common.js"></script>
  <script src="sim.js"></script>
</body>
</html>
